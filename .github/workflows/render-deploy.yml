name: CI/CD - Servicio de cedulas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar generacion de cedulas
        run: |
          python - <<'PY'
          from main import obtener_cedula

          valores = [obtener_cedula() for _ in range(100)]
          assert all(
              isinstance(valor, int) and 1_000_000_000 <= valor <= 9_999_999_999
              for valor in valores
          )
          print("Validacion correcta: 100 cedulas de 10 digitos")
          PY

      - name: Construir imagen Docker
        run: docker build --tag servicio-cedula:${{ github.sha }} .

      - name: Solicitar despliegue en Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"

      - name: Avisar si falta configurar Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' }}
        run: echo "RENDER_DEPLOY_HOOK no esta configurado; se omitio el despliegue."
